# Deploy investor static site to Hostinger via FTP.
# Target: https://ferrow.fraudaidnetwork.com
#
# Repo: this file must live in the investor GitHub repo (inv.client), at:
#   .github/workflows/deploy-investor-hostinger.yml
#
# Required GitHub Actions secrets (repo Settings → Secrets → Actions):
#   HOSTINGER_FTP_SERVER    — 92.113.24.94
#   HOSTINGER_FTP_USERNAME  — u869158881.ferrow.fraudaidnetwork.com
#   HOSTINGER_FTP_PASSWORD  — from hPanel "Change FTP password"
#   NUXT_PUBLIC_API_URL     — https://YOUR-RENDER-SERVICE.onrender.com/graphql

name: Deploy investor app (static) to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate static site
        run: npm run generate
        env:
          NUXT_PUBLIC_API_URL: ${{ secrets.NUXT_PUBLIC_API_URL }}

      - name: Upload static files to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          local-dir: .output/public/
          server-dir: ./public_html/
          dangerous-clean-slate: false
