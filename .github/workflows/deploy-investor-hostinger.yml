# Deploy pre-built static files to Hostinger via FTP.
# Build locally first, then push `dist/`:
#   NUXT_PUBLIC_API_URL=https://YOUR-API.onrender.com/graphql npm run export:static
#   git add dist && git commit -m "Update static build" && git push
#
# Required secrets:
#   HOSTINGER_FTP_SERVER
#   HOSTINGER_FTP_USERNAME
#   HOSTINGER_FTP_PASSWORD

name: Deploy investor app (static) to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-investor-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload dist to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          local-dir: dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
